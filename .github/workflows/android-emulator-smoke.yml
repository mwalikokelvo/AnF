name: Android emulator smoke

# Builds the debug APK, installs and launches it on an API 35 emulator, and keeps a screenshot.
on:
  workflow_dispatch:
  pull_request:
    paths: ['android/**', 'windows/src/workspace/**', 'scripts/build-android.mjs', 'scripts/app-qa/android-smoke.sh', '.github/workflows/android-emulator-smoke.yml']

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: |
            windows/package-lock.json
            android/package-lock.json
      - uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6.1.0
        with:
          distribution: temurin
          java-version: 21
      - uses: android-actions/setup-android@be39fa834029ff78f1a44aa3bb0819b8fc2bd8fd # v4.0.4
        with:
          cmdline-tools-version: '16111833'
          packages: platform-tools
          log-accepted-android-sdk-licenses: false
      - uses: gradle/actions/setup-gradle@8da46b539cd8fe6ab27ca75128919a18d757604c # v6.4.1
        with:
          gradle-version: 9.4.1
      - name: Install SDK
        run: node scripts/prepare-android-sdk.mjs
      - name: Install frontend dependencies
        run: |
          npm ci --prefix windows
          npm ci --prefix android
      - name: Build unsigned release and debug packages
        run: node scripts/build-android.mjs
      - name: Check packaged stylesheets
        run: node scripts/check-styles.mjs android/build/assets/web
      - name: Regression checks
        run: node scripts/check-release.mjs
      - name: Marketplace trust rules (Java)
        run: |
          javac -d "$RUNNER_TEMP/addon-check" android/java/com/anf/workspace/AddonRules.java android/java-test/com/anf/workspace/AddonRulesCheck.java
          java -cp "$RUNNER_TEMP/addon-check" com.anf.workspace.AddonRulesCheck
      - name: Enable emulator hardware acceleration
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Free unused native SDK toolchains for emulator storage
        run: sudo rm -rf /usr/local/lib/android/sdk/ndk
      - name: Install and launch the debug package on an emulator
        uses: reactivecircus/android-emulator-runner@a421e43855164a8197daf9d8d40fe71c6996bb0d # v2
        with:
          api-level: 35
          arch: x86_64
          target: google_apis
          disk-size: 2048M
          disable-animations: true
          emulator-options: -no-window -gpu swiftshader_indirect -no-audio -no-snapshot -no-boot-anim -partition-size 2048
          script: bash scripts/app-qa/android-smoke.sh
      - name: Retain emulator smoke evidence
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: AnF-Android-emulator-smoke
          path: |
            ${{ runner.temp }}/anf-android-smoke/*.txt
            ${{ runner.temp }}/anf-android-smoke/*.png
          if-no-files-found: ignore
          retention-days: 14
