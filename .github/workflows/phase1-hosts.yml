name: Phase 1 host builds

# Base development packages only. This does not sign a production release and
# does not download speech models. The Android job builds the current Java host
# without the Flutter music module, because that module is not in this checkout.
on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: phase1-hosts-${{ github.ref }}
  cancel-in-progress: true

jobs:
  windows-base:
    runs-on: windows-latest
    defaults:
      run:
        working-directory: windows
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: windows/package-lock.json
      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable
      - name: Install frontend dependencies
        run: npm ci
      - name: Prepare FFmpeg
        shell: pwsh
        continue-on-error: true
        run: ./scripts/prepare-media.ps1
      - name: Ensure media folder exists
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force media | Out-Null
          if (!(Test-Path media/SOURCES.txt)) {
            'FFmpeg was not downloaded on this runner. Audio export features that need a bundled ffmpeg.exe may be unavailable in this development package.' | Set-Content media/SOURCES.txt
          }
      - name: Build the hook relay
        run: cargo build --release -p coucou-hook
      - name: Build the base installer without offline AI assets
        shell: pwsh
        run: |
          $config = @{
            build = @{ beforeBuildCommand = $null }
            bundle = @{
              resources = @{
                '../local-ai/*.dll' = $null
                '../local-ai/llama-server.exe' = $null
                '../local-ai/model.gguf' = $null
                '../local-ai/model-fast.gguf' = $null
                '../local-ai/*.rten' = $null
                '../local-ai/*LICENSE*' = $null
                '../local-ai/NOTICE.txt' = $null
              }
            }
          } | ConvertTo-Json -Depth 5
          $path = Join-Path $env:RUNNER_TEMP 'windows-base.json'
          Set-Content -LiteralPath $path -Value $config
          npx tsc --noEmit
          if ($LASTEXITCODE) { throw 'Typecheck failed' }
          npx vite build
          if ($LASTEXITCODE) { throw 'Frontend build failed' }
          npx tauri build --bundles nsis --config $path
          if ($LASTEXITCODE) { throw 'Installer build failed' }
          Get-ChildItem target/release/bundle/nsis -ErrorAction SilentlyContinue | Format-Table Name, Length
      - name: Upload the Windows installer
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: AF-Windows-base-setup
          path: |
            windows/target/release/bundle/nsis/*.exe
            windows/target/release/AnF.exe
          if-no-files-found: error

  android-host:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: |
            windows/package-lock.json
            android/package-lock.json
      - uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6.1.0
        with:
          distribution: temurin
          java-version: 21
      - uses: android-actions/setup-android@9fc6c4e9069bf8d3d10b2204b1fb8f6ef7065407 # v3
        with:
          cmdline-tools-version: '16111833'
          packages: platform-tools
          log-accepted-android-sdk-licenses: false
      - uses: gradle/actions/setup-gradle@ed408507eac070d1f99cc633dbcf757c94c7933a # v4
        with:
          gradle-version: 9.4.1
      - name: Install SDK
        run: sdkmanager 'platforms;android-37.0' 'build-tools;36.0.0'
      - name: Install frontend dependencies
        run: |
          npm ci --prefix windows
          npm ci --prefix android
      - name: Build the current Android host
        run: node scripts/build-android.mjs
      - name: Upload Android packages
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: AF-Android-host
          path: |
            releases/AnF-Android-*.apk
            android/gradle-build/outputs/apk/debug/*.apk
            android/gradle-build/outputs/apk/release/*.apk
          if-no-files-found: error
