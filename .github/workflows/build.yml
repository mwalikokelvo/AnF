name: macOS Build (Archive)

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'archive/NotchBuddy/**'
      - '.github/workflows/build.yml'
  pull_request:
    branches: [main]
    paths:
      - 'archive/NotchBuddy/**'
      - '.github/workflows/build.yml'

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Generate project
        run: cd archive/NotchBuddy && xcodegen

      - name: Test screen geometry
        run: test -f archive/scripts/test-screen-geometry.sh && bash archive/scripts/test-screen-geometry.sh || echo "Skipping archived test"

      - name: Test link filter
        run: test -f archive/scripts/test-safe-links.sh && bash archive/scripts/test-safe-links.sh || echo "Skipping archived test"

      - name: Test chat parsing
        run: test -f archive/scripts/test-chat-parsing.sh && bash archive/scripts/test-chat-parsing.sh || echo "Skipping archived test"

      - name: Test plan gauge
        run: test -f archive/scripts/test-plan-gauge.sh && bash archive/scripts/test-plan-gauge.sh || echo "Skipping archived test"

      - name: Test ask question
        run: test -f archive/scripts/test-ask-question.sh && bash archive/scripts/test-ask-question.sh || echo "Skipping archived test"

      - name: Diff engine tests
        run: test -f archive/scripts/test-diff-engine.sh && bash archive/scripts/test-diff-engine.sh || echo "Skipping archived test"

      - name: GitHub pulse tests
        run: test -f archive/scripts/test-github-pulse.sh && bash archive/scripts/test-github-pulse.sh || echo "Skipping archived test"

      - name: GitHub activity tests
        run: test -f archive/scripts/test-github-activity.sh && bash archive/scripts/test-github-activity.sh || echo "Skipping archived test"

      - name: Build
        run: |
          xcodebuild \
            -project archive/NotchBuddy/NotchBuddy.xcodeproj \
            -scheme NotchBuddy \
            -configuration Release \
            -derivedDataPath archive/NotchBuddy/build/DerivedData \
            build \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO

      - name: Package unsigned macOS build
        run: |
          mkdir -p releases
          version=$(/usr/libexec/PlistBuddy -c 'Print :CFBundleShortVersionString' archive/NotchBuddy/Resources/Info.plist)
          ditto -c -k --sequesterRsrc --keepParent archive/NotchBuddy/build/DerivedData/Build/Products/Release/Coucou.app "releases/Coucou-macOS-$version-unsigned.zip"
          cd releases
          shasum -a 256 *.zip > SHA256SUMS-macOS

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: Coucou-macOS-unsigned
          path: releases/
          if-no-files-found: error
          retention-days: 7
