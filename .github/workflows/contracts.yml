name: Contracts

# AnF Phase 3 contract checks only. Does not touch ThingsBook/_core or SQLCipher.
on:
  push:
    branches: [main]
    paths:
      - 'contracts/**'
      - 'docs/contracts/**'
      - 'scripts/verify-contracts.mjs'
      - '.github/workflows/contracts.yml'
  pull_request:
    branches: [main]
    paths:
      - 'contracts/**'
      - 'docs/contracts/**'
      - 'scripts/verify-contracts.mjs'
      - '.github/workflows/contracts.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: contracts-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
      - name: Verify vault and sync fixtures
        run: node scripts/verify-contracts.mjs
