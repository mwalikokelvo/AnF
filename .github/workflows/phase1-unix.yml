name: Phase 1 Unix hosts

# Development packages for Linux and macOS. Unsigned. No speech models.
on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: phase1-unix-${{ github.ref }}
  cancel-in-progress: true

jobs:
  linux-appimage:
    runs-on: ubuntu-22.04
    defaults:
      run:
        working-directory: windows
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Install system libraries
        working-directory: .
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev libgtk-layer-shell-dev libayatana-appindicator3-dev \
            librsvg2-dev libssl-dev libdbus-1-dev patchelf \
            gstreamer1.0-plugins-base gstreamer1.0-plugins-good
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: windows/package-lock.json
      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable
      - name: Install frontend dependencies
        run: npm ci
      - name: Build the hook relay
        run: cargo build --release -p coucou-hook
      - name: Build the AppImage without offline AI assets
        env:
          APPIMAGE_EXTRACT_AND_RUN: "1"
        run: |
          cat > "$RUNNER_TEMP/unix-base.json" << 'JSON'
          {
            "build": { "beforeBuildCommand": null },
            "bundle": {
              "resources": {
                "../target/release/coucou-hook.exe": null,
                "../target/release/coucou-hook": "coucou-hook",
                "../local-ai/*.dll": null,
                "../local-ai/llama-server.exe": null,
                "../local-ai/model.gguf": null,
                "../local-ai/model-fast.gguf": null,
                "../local-ai/*.rten": null,
                "../local-ai/*LICENSE*": null,
                "../local-ai/NOTICE.txt": null,
                "../media/ffmpeg.exe": null
              }
            }
          }
          JSON
          npx tsc --noEmit
          npx vite build
          npx tauri build --bundles appimage --config "$RUNNER_TEMP/unix-base.json"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: AF-Linux-AppImage
          path: windows/target/release/bundle/appimage/*
          if-no-files-found: error

  macos-app:
    runs-on: macos-latest
    defaults:
      run:
        working-directory: windows
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: windows/package-lock.json
      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable
      - name: Install frontend dependencies
        run: npm ci
      - name: Build the hook relay
        run: cargo build --release -p coucou-hook
      - name: Build the macOS app without offline AI assets
        run: |
          cat > "$RUNNER_TEMP/unix-base.json" << 'JSON'
          {
            "build": { "beforeBuildCommand": null },
            "bundle": {
              "icon": ["icons/32x32.png", "icons/128x128.png", "icons/128x128@2x.png", "icons/icon.png"],
              "resources": {
                "../target/release/coucou-hook.exe": null,
                "../target/release/coucou-hook": "coucou-hook",
                "../local-ai/*.dll": null,
                "../local-ai/llama-server.exe": null,
                "../local-ai/model.gguf": null,
                "../local-ai/model-fast.gguf": null,
                "../local-ai/*.rten": null,
                "../local-ai/*LICENSE*": null,
                "../local-ai/NOTICE.txt": null,
                "../media/ffmpeg.exe": null
              }
            }
          }
          JSON
          npx tsc --noEmit
          npx vite build
          npx tauri build --bundles app --config "$RUNNER_TEMP/unix-base.json"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: AF-macOS-app
          path: windows/target/release/bundle/macos/*.app
          if-no-files-found: error
