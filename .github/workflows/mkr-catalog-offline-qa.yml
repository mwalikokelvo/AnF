name: MKR catalog offline contract QA
on:
  push:
    branches: ['qa/mkr-catalog-**']
    paths: ['integrations/mkr-music/**', '.github/workflows/mkr-catalog-offline-qa.yml']
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: mkr-catalog-offline-${{ github.ref }}
  cancel-in-progress: false
jobs:
  catalog-contract:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1
        with:
          node-version: 24
      - uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad
        with:
          distribution: temurin
          java-version: 21
      - uses: gradle/actions/setup-gradle@8da46b539cd8fe6ab27ca75128919a18d757604c
        with:
          gradle-version: 9.4.1
      - name: Prepare only the exact reviewed upstream source allowlist
        run: |
          set -euo pipefail
          git init "$RUNNER_TEMP/mkr-upstream"
          git -C "$RUNNER_TEMP/mkr-upstream" remote add origin https://github.com/mkr-infinity/mkr-music.git
          git -C "$RUNNER_TEMP/mkr-upstream" fetch --depth=1 origin 78ac80c5101c293a5591a4cd5a1ebc90ccbc3138
          node integrations/mkr-music/prepare-catalog.mjs --source "$RUNNER_TEMP/mkr-upstream"
      - name: Compile and test fixture contracts; never run a live provider probe
        working-directory: integrations/mkr-music/engine
        run: gradle --no-daemon --max-workers=2 test
      - name: Retain reports only, not a runtime or distributable player
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: MKR-catalog-offline-contract-evidence
          path: |
            integrations/mkr-music/engine/build/test-results/**/*.xml
            integrations/mkr-music/engine/build/reports/dependency-verification/**/*.html
          if-no-files-found: ignore
          retention-days: 7
