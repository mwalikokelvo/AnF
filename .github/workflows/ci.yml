name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

env:
  CARGO_TERM_COLOR: never

jobs:
  verify:
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest]

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install Rust stable
        uses: dtolnay/rust-action@stable
        with:
          cache: false

      - name: Install Linux GUI dev packages (Ubuntu)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            libgtk-3-dev \
            libglib2.0-dev \
            libpulse-dev \
            libssl-dev

      - name: Install Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: windows/package-lock.json

      - name: npm ci + Vite build (Tauri app)
        run: |
          npm ci --no-audit --no-fund
          npm run build
        working-directory: windows

      - name: Cargo check
        run: cargo check --all-targets --locked
        working-directory: windows/src-tauri

      - name: Cargo clippy (warnings as errors)
        run: cargo clippy --all-targets --locked -- -D warnings

      - name: Cargo test
        run: cargo test --locked
        working-directory: windows/src-tauri
