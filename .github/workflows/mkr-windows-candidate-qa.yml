name: MKR Windows candidate runtime handshake
on:
  push:
    branches: ['qa/mkr-windows-candidate-**']
    paths:
      - integrations/mkr-music/**
      - scripts/check-mkr-windows-jdk.py
      - .github/workflows/mkr-windows-candidate-qa.yml
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: mkr-windows-candidate-${{ github.ref }}
  cancel-in-progress: false
jobs:
  candidate-handshake:
    runs-on: windows-2025
    timeout-minutes: 35
    defaults:
      run:
        shell: pwsh
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1
        with:
          node-version: 24
      - name: Install locked workflow validation tools
        working-directory: windows
        run: npm ci --ignore-scripts --no-audit --no-fund
      - name: Validate workflow boundaries and syntax before runtime preparation
        run: |
          $ErrorActionPreference = 'Stop'
          node scripts/check-workflows.mjs
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          node scripts/check-branding.mjs
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Check archive guards and prepare only the pinned Microsoft JDK
        run: |
          $ErrorActionPreference = 'Stop'
          python -B scripts/check-mkr-windows-jdk.py
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          python -B integrations/mkr-music/prepare-hosted-windows-jdk.py --output "$env:RUNNER_TEMP/anf-candidate-jdk"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - uses: gradle/actions/setup-gradle@8da46b539cd8fe6ab27ca75128919a18d757604c
        with:
          gradle-version: 9.4.1
      - name: Prepare the exact upstream source allowlist without application modules
        run: |
          $ErrorActionPreference = 'Stop'
          git init "$env:RUNNER_TEMP/mkr-upstream"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          git -C "$env:RUNNER_TEMP/mkr-upstream" remote add origin https://github.com/mkr-infinity/mkr-music.git
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          git -C "$env:RUNNER_TEMP/mkr-upstream" fetch --depth=1 origin 78ac80c5101c293a5591a4cd5a1ebc90ccbc3138
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          node integrations/mkr-music/prepare-catalog.mjs --source "$env:RUNNER_TEMP/mkr-upstream"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Build and test the missing engine with no alternate Java toolchain
        working-directory: integrations/mkr-music/engine
        run: |
          $ErrorActionPreference = 'Stop'
          gradle --no-daemon --max-workers=2 "-Dorg.gradle.java.home=$env:JAVA_HOME" "-Dorg.gradle.java.installations.paths=$env:JAVA_HOME" "-Dorg.gradle.java.installations.auto-detect=false" "-Dorg.gradle.java.installations.auto-download=false" verifyKtorAlignment test auditWindowsRuntime
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Create a fresh engineering image only after source-bound preflight
        run: |
          $ErrorActionPreference = 'Stop'
          node scripts/check-mkr-jdk-source-binding.mjs
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          node integrations/mkr-music/prepare-runtime-candidate.mjs
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $pointer = Get-Content -LiteralPath 'integrations/mkr-music/engine/build/reports/latest-runtime-candidate.json' -Raw | ConvertFrom-Json
          "ANF_MKR_CANDIDATE_BUNDLE=$($pointer.bundle)" | Out-File -LiteralPath $env:GITHUB_ENV -Append -Encoding utf8
      - name: Exercise actual canonical-path native JVM handshake and private release RPC
        run: |
          $ErrorActionPreference = 'Stop'
          $reports = Join-Path $env:RUNNER_TEMP 'anf-candidate-reports'
          New-Item -ItemType Directory -Path $reports | Out-Null
          cargo test --locked --manifest-path integrations/mkr-music/windows-native/Cargo.toml resources::tests::real_candidate_inventory_and_child_handshake -- --ignored --exact --nocapture 2>&1 | Tee-Object -FilePath "$reports/handshake.txt"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          python -B integrations/mkr-music/report-windows-candidate.py --output "$reports"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Keep reports and legal text only, never the candidate binaries
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: AnF-Windows-candidate-handshake-evidence
          path: |
            ${{ runner.temp }}/anf-candidate-reports/
            ${{ runner.temp }}/anf-candidate-jdk/jdk-input-proof.json
            integrations/mkr-music/engine/build/test-results/**/*.xml
            integrations/mkr-music/engine/build/reports/ktor-alignment.json
            integrations/mkr-music/engine/build/reports/runtime-dependencies.json
            integrations/mkr-music/engine/build/reports/dependency-verification/**/*.html
          if-no-files-found: ignore
          retention-days: 14
