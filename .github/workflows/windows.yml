name: Windows

# Builds Windows release artifacts. Publication remains a separate action.
# Triggered by tags like `windows-v0.1.0`; the macOS workflows are untouched.

on:
  push:
    tags:
      - 'windows-v*'
  workflow_dispatch:
    inputs:
      baseline_run:
        description: 'Run containing the previous Coucou-Windows-setup artifact for installation upgrade QA'
        required: false
        type: string
      candidate_run:
        description: 'Optional completed build run to test without rebuilding'
        required: false
        type: string
      downloads_run:
        description: 'Completed AnF Windows build run to upload to a private draft download release'
        required: false
        type: string
      android_download_branch:
        description: 'Branch containing only signed Android downloads (no signing keys)'
        required: false
        type: string
  pull_request:
    paths: ['windows/**', '.github/workflows/windows.yml']

permissions:
  contents: read
  actions: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

# Publishing is paused: Defender flags the unsigned installer as
# Trojan:Win32/Wacatac.H!ml (false positive, reported to Microsoft). Tags still
# build, to check the app compiles, but nothing is uploaded. Set this back to
# 'true' once the installer is signed or the detection is cleared.
env:
  PUBLISH: 'false'

jobs:
  build:
    if: inputs.candidate_run == '' && inputs.downloads_run == ''
    runs-on: windows-latest
    env:
      CARGO_BUILD_JOBS: 2
      CARGO_PROFILE_DEV_DEBUG: 0
      CARGO_PROFILE_TEST_DEBUG: 0
      CARGO_INCREMENTAL: 0
    defaults:
      run:
        working-directory: windows

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: windows/package-lock.json

      - name: Cache cargo
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            windows/target
          key: windows-cargo-${{ hashFiles('windows/Cargo.lock') }}
          restore-keys: windows-cargo-

      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable
        with:
          toolchain: 1.99.0

      - name: Install dependencies
        run: npm ci

      # Three files carry the version and they drift silently. Publishing a
      # "0.1.1" that installs a 0.1.0 is the kind of thing nobody notices until
      # a bug report arrives against the wrong build.
      - name: Check the tag and every version agree
        if: startsWith(github.ref, 'refs/tags/windows-v')
        shell: pwsh
        run: |
          $tag  = "${{ github.ref_name }}" -replace '^windows-v', ''
          $conf = (Get-Content src-tauri/tauri.conf.json | ConvertFrom-Json).version
          $pkg  = (Get-Content package.json | ConvertFrom-Json).version
          $cargo = (Select-String -Path Cargo.toml -Pattern '^version\s*=\s*"(.+)"').Matches[0].Groups[1].Value
          "tag=$tag tauri.conf=$conf package.json=$pkg Cargo.toml=$cargo"
          $bad = @()
          if ($tag -ne $conf)  { $bad += "tauri.conf.json says $conf" }
          if ($tag -ne $pkg)   { $bad += "package.json says $pkg" }
          if ($tag -ne $cargo) { $bad += "Cargo.toml says $cargo" }
          if ($bad) { throw "tag says $tag but $($bad -join '; ')" }

      # `npm run build` (run by tauri as beforeBuildCommand) builds coucou-hook
      # first, which tauri.conf.json then bundles as a resource. `pack` then
      # copies the installer out of target/ under its shipping name.
      - name: Prepare verified offline AI and OCR assets
        shell: pwsh
        run: ./scripts/prepare-offline.ps1

      - name: Prepare verified audio runtime
        shell: pwsh
        run: ./scripts/prepare-media.ps1

      - name: Test native behavior
        shell: pwsh
        run: |
          cargo build --release --locked -p coucou-hook
          if ($LASTEXITCODE) { throw 'Hook build failed' }
          cargo test --locked -p coucou --lib -- --test-threads=1
          if ($LASTEXITCODE) { throw 'Native tests failed' }
          cargo test --locked -p coucou --lib local_ai::tests::switches_between_fast_and_balanced_models_without_keys -- --ignored --exact --test-threads=1
          if ($LASTEXITCODE) { throw 'Offline model switching test failed' }
          cargo test --locked -p coucou --lib local_ai::tests::cancellation_stops_the_owned_model_process -- --ignored --exact --test-threads=1
          if ($LASTEXITCODE) { throw 'Offline cancellation test failed' }
          npm ci --prefix ../android
          if ($LASTEXITCODE) { throw 'Android frontend dependencies failed' }
          node ../scripts/check-release.mjs
          if ($LASTEXITCODE) { throw 'Frontend regression checks failed' }

      # Code signing is opt-in. With no WINDOWS_CERTIFICATE secret this step only prints a notice and the
      # installer stays unsigned, exactly as before. With it, Tauri signs the app and the installer.
      # The certificate is imported into this runner's temporary user store; nothing is written to the repo.
      # It runs only for release tags and manual runs from main, never for pull requests: a PR build runs
      # PR-controlled scripts and must not be able to use or exfiltrate the signing key.
      - name: Prepare code signing (only when a certificate is configured)
        id: signing
        if: github.event_name == 'push' || (github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main')
        shell: pwsh
        env:
          WINDOWS_CERTIFICATE: ${{ secrets.WINDOWS_CERTIFICATE }}
          WINDOWS_CERTIFICATE_PASSWORD: ${{ secrets.WINDOWS_CERTIFICATE_PASSWORD }}
        run: |
          if (-not $env:WINDOWS_CERTIFICATE) {
            Write-Host '::notice title=Windows signing::No WINDOWS_CERTIFICATE secret, so the installer is unsigned.'
            'signed=false' >> $env:GITHUB_OUTPUT
            return
          }
          if (-not $env:WINDOWS_CERTIFICATE_PASSWORD) { throw 'WINDOWS_CERTIFICATE is set but WINDOWS_CERTIFICATE_PASSWORD is not.' }
          $pfx = Join-Path $env:RUNNER_TEMP 'anf-signing.pfx'
          [IO.File]::WriteAllBytes($pfx, [Convert]::FromBase64String($env:WINDOWS_CERTIFICATE))
          try {
            $cert = Import-PfxCertificate -FilePath $pfx -CertStoreLocation Cert:\CurrentUser\My -Password (ConvertTo-SecureString -String $env:WINDOWS_CERTIFICATE_PASSWORD -AsPlainText -Force)
          } finally { Remove-Item $pfx -Force -ErrorAction SilentlyContinue }
          $config = @{ bundle = @{ windows = @{ certificateThumbprint = $cert.Thumbprint; digestAlgorithm = 'sha256'; timestampUrl = 'http://timestamp.digicert.com' } } } | ConvertTo-Json -Depth 5 -Compress
          # A platform config file is merged by `tauri build` into the bundler settings; the TAURI_CONFIG
          # environment variable is not, so it would leave the installer unsigned.
          Set-Content -Path src-tauri/tauri.windows.conf.json -Value $config -Encoding utf8
          'signed=true' >> $env:GITHUB_OUTPUT
          Write-Host "Signing with certificate: $($cert.Subject)"

      - name: Build and pack the installer
        id: pack
        shell: pwsh
        run: |
          Remove-Item target/debug,target/offline-runtime,target/media-runtime -Recurse -Force -ErrorAction SilentlyContinue
          Remove-Item local-ai/model-source.gguf,local-ai/runtime.zip -Force -ErrorAction SilentlyContinue
          npm run pack
          if ($LASTEXITCODE) { throw 'Packaging failed' }
          $version = (Get-Content src-tauri/tauri.conf.json | ConvertFrom-Json).version
          "version=$version" >> $env:GITHUB_OUTPUT
          Get-ChildItem release | Format-Table Name, Length
          Get-ChildItem release -File -Filter "AnF-Windows-$version-setup.exe" | ForEach-Object {
            $hash = (Get-FileHash $_.FullName -Algorithm SHA256).Hash.ToLowerInvariant()
            "$hash  $($_.Name)"
          } | Set-Content release/SHA256SUMS-Windows

      - name: Verify the installer signature
        if: steps.signing.outputs.signed == 'true'
        shell: pwsh
        run: |
          $files = Get-ChildItem release -File -Filter 'AnF-Windows-*setup.exe'
          if (-not $files) { throw 'No installer found to verify.' }
          foreach ($f in $files) {
            $sig = Get-AuthenticodeSignature $f.FullName
            if ($sig.Status -ne 'Valid') { throw "$($f.Name) signature is $($sig.Status): $($sig.StatusMessage)" }
            if (-not $sig.TimeStamperCertificate) { throw "$($f.Name) has no timestamp, so it would stop validating when the certificate expires." }
            Write-Host "$($f.Name): valid, signed by $($sig.SignerCertificate.Subject)"
          }

      # Upload review builds and manual runs without publishing a release.
      # The repo is public, so artifacts are downloadable by any signed-in GitHub
      # user; automatic tag uploads stay paused until explicitly enabled.
      - name: Download previous installer for upgrade verification
        if: github.event_name == 'workflow_dispatch' && inputs.baseline_run != ''
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: Coucou-Windows-setup
          run-id: ${{ inputs.baseline_run }}
          github-token: ${{ github.token }}
          path: previous-installer

      - name: Verify installed application and preserve existing data
        if: github.event_name == 'workflow_dispatch' && inputs.baseline_run != ''
        shell: pwsh
        working-directory: .
        run: |
          npm ci --prefix scripts/app-qa --ignore-scripts
          if ($LASTEXITCODE) { throw 'UI test dependencies failed' }
          $baseline = (Get-ChildItem previous-installer -Filter '*setup.exe').FullName
          $version = (Get-Content windows/src-tauri/tauri.conf.json | ConvertFrom-Json).version
          $candidate = (Resolve-Path "windows/release/AnF-Windows-$version-setup.exe").Path
          ./scripts/app-qa/windows-upgrade.ps1 -Baseline $baseline -Candidate $candidate

      - name: Retain installed application test evidence
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: always() && github.event_name == 'workflow_dispatch' && inputs.baseline_run != ''
        with:
          name: AnF-Windows-installation-tests
          path: ${{ runner.temp }}/anf-app-upgrade/results/
          if-no-files-found: ignore
          retention-days: 7

      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: github.event_name != 'push' || env.PUBLISH == 'true'
        with:
          name: AnF-Windows-setup
          path: |
            windows/release/AnF-Windows-${{ steps.pack.outputs.version }}-setup.exe
            windows/release/SHA256SUMS-Windows
          if-no-files-found: error
          retention-days: 7

      # Keep models and native runtimes with the portable executables.
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: github.event_name != 'push' || env.PUBLISH == 'true'
        with:
          name: AnF-Windows-portable
          path: windows/release/AnF-Windows-${{ steps.pack.outputs.version }}-portable/
          if-no-files-found: error
          retention-days: 7

  installation:
    if: github.event_name == 'workflow_dispatch' && inputs.candidate_run != '' && inputs.downloads_run == ''
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: Coucou-Windows-setup
          run-id: ${{ inputs.baseline_run }}
          github-token: ${{ github.token }}
          path: previous-installer
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: AnF-Windows-setup
          run-id: ${{ inputs.candidate_run }}
          github-token: ${{ github.token }}
          path: candidate-installer
      - name: Verify installed application and preserve existing data
        shell: pwsh
        run: |
          npm ci --prefix scripts/app-qa --ignore-scripts
          if ($LASTEXITCODE) { throw 'UI test dependencies failed' }
          $baseline = (Get-ChildItem previous-installer -Filter '*setup.exe').FullName
          $version = (Get-Content windows/src-tauri/tauri.conf.json | ConvertFrom-Json).version
          $candidate = (Resolve-Path "candidate-installer/AnF-Windows-$version-setup.exe").Path
          ./scripts/app-qa/windows-upgrade.ps1 -Baseline $baseline -Candidate $candidate
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: always()
        with:
          name: AnF-Windows-installation-tests
          path: ${{ runner.temp }}/anf-app-upgrade/results/
          if-no-files-found: ignore
          retention-days: 7

  private-downloads:
    if: github.event_name == 'workflow_dispatch' && inputs.downloads_run != ''
    runs-on: ubuntu-24.04
    permissions:
      actions: read
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Require a signed APK download branch
        env:
          DOWNLOAD_BRANCH: ${{ inputs.android_download_branch }}
        run: test -n "$DOWNLOAD_BRANCH"
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.android_download_branch }}
          path: android-downloads
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: AnF-Windows-setup
          run-id: ${{ inputs.downloads_run }}
          github-token: ${{ github.token }}
          path: windows-downloads
      - name: Verify files and create private draft download assets
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          version=$(node -p "require('./windows/src-tauri/tauri.conf.json').version")
          tag="anf-v$version-downloads"
          (cd android-downloads && sha256sum -c SHA256SUMS-Android)
          (cd windows-downloads && sha256sum -c SHA256SUMS-Windows)
          cat > download-notes.md <<'EOF'
          AnF for Android and Windows. Download the APK or standalone Windows installer from Assets below.

          Install Android over your existing app. The main APK uses your original release key; the alternate uses your supplied original debug key. Keep the existing app installed if Android rejects an update. These keys cannot update the earlier temporary CI debug APK from chat.

          Quit the Windows app from its tray menu before updating. The AnF installer retains the previous installation folder and data. This Windows installer is unsigned; the repository records an unresolved Defender detection. Do not disable antivirus if it blocks installation. Public Windows publication remains paused.

          Light, dark and device themes, new navigation and AnF icons are included. Android AI uses a paired Windows PC or optional browser services. Original signing keys and passwords are not included in downloads or CI.
          EOF
          if gh release view "$tag" --json isDraft > draft-status.json 2>/dev/null; then
            node -e "if (!require('./draft-status.json').isDraft) process.exit(1)"
          else
            gh release create "$tag" --draft --target "$GITHUB_SHA" --title "AnF $version — Android and Windows downloads" --notes-file download-notes.md
          fi
          gh release upload "$tag" --clobber \
            "android-downloads/AnF-Android-$version.apk" \
            "android-downloads/AnF-Android-$version-debug-key-update.apk" \
            android-downloads/SHA256SUMS-Android \
            "windows-downloads/AnF-Windows-$version-setup.exe" \
            windows-downloads/SHA256SUMS-Windows
          gh release edit "$tag" --title "AnF $version — Android and Windows downloads" --notes-file download-notes.md
