name: Windows

# Builds Windows release artifacts. Publication remains a separate action.
# Triggered by tags like `windows-v0.1.0`; the macOS workflows are untouched.

on:
  push:
    tags:
      - 'windows-v*'
  workflow_dispatch:
    inputs:
      baseline_run:
        description: 'Run containing the previous Coucou-Windows-setup artifact for installation upgrade QA'
        required: false
        type: string
      candidate_run:
        description: 'Optional completed build run to test without rebuilding'
        required: false
        type: string
  pull_request:
    paths: ['windows/**', '.github/workflows/windows.yml']

permissions:
  contents: read
  actions: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

# Publishing is paused: Defender flags the unsigned installer as
# Trojan:Win32/Wacatac.H!ml (false positive, reported to Microsoft). Tags still
# build, to check the app compiles, but nothing is uploaded. Set this back to
# 'true' once the installer is signed or the detection is cleared.
env:
  PUBLISH: 'false'

jobs:
  build:
    if: inputs.candidate_run == ''
    runs-on: windows-latest
    env:
      CARGO_BUILD_JOBS: 2
      CARGO_PROFILE_DEV_DEBUG: 0
      CARGO_PROFILE_TEST_DEBUG: 0
      CARGO_INCREMENTAL: 0
    defaults:
      run:
        working-directory: windows

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: windows/package-lock.json

      - name: Cache cargo
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            windows/target
          key: windows-cargo-${{ hashFiles('windows/Cargo.lock') }}
          restore-keys: windows-cargo-

      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: 1.99.0

      - name: Install dependencies
        run: npm ci

      # Three files carry the version and they drift silently. Publishing a
      # "0.1.1" that installs a 0.1.0 is the kind of thing nobody notices until
      # a bug report arrives against the wrong build.
      - name: Check the tag and every version agree
        if: startsWith(github.ref, 'refs/tags/windows-v')
        shell: pwsh
        run: |
          $tag  = "${{ github.ref_name }}" -replace '^windows-v', ''
          $conf = (Get-Content src-tauri/tauri.conf.json | ConvertFrom-Json).version
          $pkg  = (Get-Content package.json | ConvertFrom-Json).version
          $cargo = (Select-String -Path Cargo.toml -Pattern '^version\s*=\s*"(.+)"').Matches[0].Groups[1].Value
          "tag=$tag tauri.conf=$conf package.json=$pkg Cargo.toml=$cargo"
          $bad = @()
          if ($tag -ne $conf)  { $bad += "tauri.conf.json says $conf" }
          if ($tag -ne $pkg)   { $bad += "package.json says $pkg" }
          if ($tag -ne $cargo) { $bad += "Cargo.toml says $cargo" }
          if ($bad) { throw "tag says $tag but $($bad -join '; ')" }

      # `npm run build` (run by tauri as beforeBuildCommand) builds coucou-hook
      # first, which tauri.conf.json then bundles as a resource. `pack` then
      # copies the installer out of target/ under its shipping name.
      - name: Prepare verified offline AI and OCR assets
        shell: pwsh
        run: ./scripts/prepare-offline.ps1

      - name: Prepare verified audio runtime
        shell: pwsh
        run: ./scripts/prepare-media.ps1

      - name: Test native behavior
        shell: pwsh
        run: |
          cargo build --release --locked -p coucou-hook
          if ($LASTEXITCODE) { throw 'Hook build failed' }
          cargo test --locked -p coucou --lib -- --test-threads=1
          if ($LASTEXITCODE) { throw 'Native tests failed' }
          cargo test --locked -p coucou --lib local_ai::tests::switches_between_fast_and_balanced_models_without_keys -- --ignored --exact --test-threads=1
          if ($LASTEXITCODE) { throw 'Offline model switching test failed' }
          cargo test --locked -p coucou --lib local_ai::tests::cancellation_stops_the_owned_model_process -- --ignored --exact --test-threads=1
          if ($LASTEXITCODE) { throw 'Offline cancellation test failed' }
          npm ci --prefix ../android
          if ($LASTEXITCODE) { throw 'Android frontend dependencies failed' }
          node ../scripts/check-release.mjs
          if ($LASTEXITCODE) { throw 'Frontend regression checks failed' }

      - name: Build and pack the installer
        id: pack
        shell: pwsh
        run: |
          Remove-Item target/debug,target/offline-runtime,target/media-runtime -Recurse -Force -ErrorAction SilentlyContinue
          Remove-Item local-ai/model-source.gguf,local-ai/runtime.zip -Force -ErrorAction SilentlyContinue
          npm run pack
          if ($LASTEXITCODE) { throw 'Packaging failed' }
          $version = (Get-Content src-tauri/tauri.conf.json | ConvertFrom-Json).version
          "version=$version" >> $env:GITHUB_OUTPUT
          Get-ChildItem release | Format-Table Name, Length
          Get-ChildItem release -File -Filter '*.exe' | ForEach-Object {
            $hash = (Get-FileHash $_.FullName -Algorithm SHA256).Hash.ToLowerInvariant()
            "$hash  $($_.Name)"
          } | Set-Content release/SHA256SUMS-Windows

      # Upload review builds and manual runs without publishing a release.
      # The repo is public, so artifacts are downloadable by any signed-in GitHub
      # user; automatic tag uploads stay paused until explicitly enabled.
      - name: Download previous installer for upgrade verification
        if: github.event_name == 'workflow_dispatch' && inputs.baseline_run != ''
        uses: actions/download-artifact@v4
        with:
          name: Coucou-Windows-setup
          run-id: ${{ inputs.baseline_run }}
          github-token: ${{ github.token }}
          path: previous-installer

      - name: Verify installed application and preserve existing data
        if: github.event_name == 'workflow_dispatch' && inputs.baseline_run != ''
        shell: pwsh
        working-directory: .
        run: |
          npm ci --prefix scripts/app-qa --ignore-scripts
          if ($LASTEXITCODE) { throw 'UI test dependencies failed' }
          $baseline = (Get-ChildItem previous-installer -Filter '*setup.exe').FullName
          $version = (Get-Content windows/src-tauri/tauri.conf.json | ConvertFrom-Json).version
          $candidate = (Resolve-Path "windows/release/Coucou-Windows-$version-setup.exe").Path
          ./scripts/app-qa/windows-upgrade.ps1 -Baseline $baseline -Candidate $candidate

      - name: Retain installed application test evidence
        uses: actions/upload-artifact@v4
        if: always() && github.event_name == 'workflow_dispatch' && inputs.baseline_run != ''
        with:
          name: Coucou-Windows-installation-tests
          path: ${{ runner.temp }}/anf-app-upgrade/results/
          if-no-files-found: ignore
          retention-days: 7

      - uses: actions/upload-artifact@v4
        if: github.event_name != 'push' || env.PUBLISH == 'true'
        with:
          name: Coucou-Windows-setup
          path: |
            windows/release/Coucou-Windows-${{ steps.pack.outputs.version }}-setup.exe
            windows/release/SHA256SUMS-Windows
          if-no-files-found: error
          retention-days: 7

      # Keep models and native runtimes with the portable executables.
      - uses: actions/upload-artifact@v4
        if: github.event_name != 'push' || env.PUBLISH == 'true'
        with:
          name: Coucou-Windows-portable
          path: windows/release/Coucou-Windows-${{ steps.pack.outputs.version }}-portable/
          if-no-files-found: error
          retention-days: 7

  installation:
    if: github.event_name == 'workflow_dispatch' && inputs.candidate_run != ''
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - uses: actions/download-artifact@v4
        with:
          name: Coucou-Windows-setup
          run-id: ${{ inputs.baseline_run }}
          github-token: ${{ github.token }}
          path: previous-installer
      - uses: actions/download-artifact@v4
        with:
          name: Coucou-Windows-setup
          run-id: ${{ inputs.candidate_run }}
          github-token: ${{ github.token }}
          path: candidate-installer
      - name: Verify installed application and preserve existing data
        shell: pwsh
        run: |
          npm ci --prefix scripts/app-qa --ignore-scripts
          if ($LASTEXITCODE) { throw 'UI test dependencies failed' }
          $baseline = (Get-ChildItem previous-installer -Filter '*setup.exe').FullName
          $version = (Get-Content windows/src-tauri/tauri.conf.json | ConvertFrom-Json).version
          $candidate = (Resolve-Path "candidate-installer/Coucou-Windows-$version-setup.exe").Path
          ./scripts/app-qa/windows-upgrade.ps1 -Baseline $baseline -Candidate $candidate
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: Coucou-Windows-installation-tests
          path: ${{ runner.temp }}/anf-app-upgrade/results/
          if-no-files-found: ignore
          retention-days: 7
