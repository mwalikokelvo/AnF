name: Dependency audit
# Weekly check for known advisories in npm and Cargo dependencies. A red run means
# "look at this", it never blocks a pull request or a release.
on:
  schedule:
    - cron: '41 5 * * 1'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  npm:
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        dir: [windows, android, scripts/app-qa]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - run: npm audit --prefix ${{ matrix.dir }}
  cargo:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - run: cargo install cargo-audit --locked
      # zip: advisories concern ZipArchive::extract(), which AnF never calls (it only reads
      # individual members). Remove once zip is on 9.x.
      # libsqlite3-sys: medium advisory on the bundled C SQLite; upgrade rusqlite when practical.
      # glib (RUSTSEC-2024-0429): unsound Iterator impls for glib::VariantStrIter. AnF never calls
      # it; glib 0.20 needs gtk-rs 0.20, which the tao/wry/gtk 0.18 stack Tauri 2.12 pins does not
      # support yet. Revisit when Tauri moves to gtk-rs 0.20.
      # zip 0545/0548: AES entries and ZipStreamReader. AnF builds zip without the `aes` feature
      # and reads through ZipArchive/enclosed_name, so neither path exists here. Remove with zip 9.x.
      - run: >
          cargo audit --file windows/Cargo.lock
          --ignore RUSTSEC-2026-0367 --ignore RUSTSEC-2026-0368 --ignore RUSTSEC-2026-0369
          --ignore RUSTSEC-2026-0429 --ignore RUSTSEC-2026-0459
          --ignore RUSTSEC-2024-0429 --ignore RUSTSEC-2026-0545 --ignore RUSTSEC-2026-0548
