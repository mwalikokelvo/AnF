name: Dependency review
# Fails a pull request that adds a dependency with a known high-severity advisory.
on:
  pull_request:
    paths: ['**/package.json', '**/package-lock.json', '**/Cargo.toml', '**/Cargo.lock', '**/build.gradle*', '**/*.gradle.kts', '.github/workflows/**']
permissions:
  contents: read
jobs:
  review:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/dependency-review-action@a1d282b36b6f3519aa1f3fc636f609c47dddb294 # v5.0.0
        with:
          fail-on-severity: high
