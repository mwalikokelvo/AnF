name: CodeQL
# Static security analysis. Reports to the Security tab; it never blocks a release.
on:
  pull_request:
    paths: ['windows/src/**', 'windows/src-tauri/**', 'android/web/**', 'scripts/**', '.github/workflows/**']
  push:
    branches: [main]
  schedule:
    - cron: '23 4 * * 2'
permissions:
  contents: read
concurrency:
  group: codeql-${{ github.ref }}
  cancel-in-progress: true
jobs:
  analyze:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      contents: read
      security-events: write
    strategy:
      fail-fast: false
      matrix:
        # No build needed for any of these, so no system libraries are installed.
        language: [javascript-typescript, actions, rust]
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: github/codeql-action/init@9b3254085494b55a0f7c4c2b3d2d52cc712ce370 # v4.39.1
        with:
          languages: ${{ matrix.language }}
          build-mode: none
      - uses: github/codeql-action/analyze@9b3254085494b55a0f7c4c2b3d2d52cc712ce370 # v4.39.1
        with:
          category: /language:${{ matrix.language }}
