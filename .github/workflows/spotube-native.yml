name: Embedded Spotube review builds
on:
  pull_request:
    paths: ['integrations/spotube/**', 'android/spotube-host/**', 'android/web/spotube.ts', 'android/web/native-media.ts', 'windows/src/workspace/native-music-player.ts', 'windows/src/workspace/spotube-desktop.ts', 'windows/src-tauri/src/music_native.rs', '.github/workflows/spotube-native.yml']
  workflow_dispatch:
    inputs:
      platform:
        description: Native runtime and AnF review package to build
        type: choice
        options: [both, android, windows]
        default: both
permissions:
  contents: read
concurrency:
  group: spotube-${{ github.ref }}-${{ inputs.platform }}
  cancel-in-progress: true
jobs:
  android:
    if: inputs.platform != 'windows'
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
      - uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6.1.0
        with:
          distribution: temurin
          java-version: 21
      - uses: android-actions/setup-android@9fc6c4e9069bf8d3d10b2204b1fb8f6ef7065407 # v3
        with:
          packages: platform-tools
      - uses: gradle/actions/setup-gradle@ed408507eac070d1f99cc633dbcf757c94c7933a # v4
        with:
          gradle-version: 9.4.1
      - uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2
        with:
          flutter-version: 3.35.2
          channel: stable
      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable
        with:
          toolchain: 1.99.0
      - name: Prepare pinned native music module
        run: node integrations/spotube/prepare.mjs
      - name: Build unsigned native music libraries
        # The Gradle "What went wrong" lines also go to an annotation, so the reason shows on the check.
        run: |
          set -o pipefail
          node integrations/spotube/build-android.mjs 2>&1 | tee "$RUNNER_TEMP/aar.log" || {
            why=$({ grep -m1 -A12 'Failed to transform' "$RUNNER_TEMP/aar.log" | cut -c1-700 | grep -vE '^\s*$' | sed -E 's/.*(Caused by|Could not|Unsupported|java\.|Error)/\1/' | cut -c1-220; grep -m5 -iE 'Caused by|OutOfMemory|timed out|Could not (GET|HEAD)|Unsupported' "$RUNNER_TEMP/aar.log" | cut -c1-220; } | head -c 2500 | paste -sd'|' | sed 's/|/%0A/g') || true
            echo "::error title=Spotube Android libraries failed::${why:-no Gradle message, see log}"
            exit 1
          }
      - name: Build AnF with embedded music
        run: |
          sdkmanager 'platforms;android-37.0' 'build-tools;36.0.0'
          npm ci --prefix windows
          npm ci --prefix android
          node scripts/build-android.mjs --with-spotube
          node scripts/check-release.mjs
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: AnF-Android-embedded-Spotube-review
          path: releases/AnF-Android-*.apk
          retention-days: 7
          if-no-files-found: error
  windows:
    if: inputs.platform != 'android'
    # windows-latest has Visual Studio 2026 since June 2026, which Flutter 3.35 does not
    # know (it falls back to "Visual Studio 16 2019" and CMake fails). Stay on VS 2022.
    runs-on: windows-2022
    timeout-minutes: 90
    env:
      CARGO_BUILD_JOBS: 2
      CARGO_INCREMENTAL: 0
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable
        with:
          toolchain: 1.99.0
      - uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2
        with:
          flutter-version: 3.35.2
          channel: stable
      - name: Prepare pinned embedded music
        run: node integrations/spotube/prepare.mjs --windows
      - name: Build native child view
        working-directory: windows/spotube-native
        # The first error lines also go to an annotation, so the reason shows on the check.
        run: |
          flutter build windows --release 2>&1 | Tee-Object -FilePath "$env:RUNNER_TEMP/flutter-build.log"
          if ($LASTEXITCODE -ne 0) {
            $lines = @(Get-Content "$env:RUNNER_TEMP/flutter-build.log")
            $hit = $lines | Select-String -Pattern 'error|fatal|FAILED' | Select-Object -First 1
            $start = if ($hit) { $hit.LineNumber - 1 } else { 0 }
            $found = $lines[$start..([Math]::Min($start + 9, $lines.Count - 1))] | ForEach-Object { $_.Trim() }
            Write-Host "::error title=flutter build windows failed::$($found -join '%0A')"
            exit 1
          }
      - name: Prepare the existing offline AnF resources
        working-directory: windows
        run: |
          npm ci
          ./scripts/prepare-offline.ps1
          ./scripts/prepare-media.ps1
      - name: Build the AnF review installer and portable package
        working-directory: windows
        run: |
          cargo build --release --locked -p coucou-hook
          npm exec tauri -- build --features embedded-music --config src-tauri/tauri.spotube.conf.json
          node scripts/pack.mjs --with-spotube
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: AnF-Windows-embedded-Spotube-review
          path: windows/release/
          retention-days: 7
          if-no-files-found: error
