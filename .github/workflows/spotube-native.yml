name: Embedded Spotube review builds
on:
  pull_request:
    paths: ['integrations/spotube/**', 'android/spotube-host/**', 'android/web/spotube.ts', 'android/web/native-media.ts', 'windows/src/workspace/native-music-player.ts', 'windows/src/workspace/spotube-desktop.ts', 'windows/src-tauri/src/music_native.rs', '.github/workflows/spotube-native.yml']
  workflow_dispatch:
    inputs:
      platform:
        description: Native runtime and AnF review package to build
        type: choice
        options: [both, android, windows]
        default: both
permissions:
  contents: read
concurrency:
  group: spotube-${{ github.ref }}-${{ inputs.platform }}
  cancel-in-progress: true
jobs:
  android:
    if: inputs.platform != 'windows'
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 24
      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4
        with:
          distribution: temurin
          java-version: 21
      - uses: android-actions/setup-android@9fc6c4e9069bf8d3d10b2204b1fb8f6ef7065407 # v3
        with:
          packages: platform-tools
      - uses: gradle/actions/setup-gradle@ed408507eac070d1f99cc633dbcf757c94c7933a # v4
        with:
          gradle-version: 9.4.1
      - uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2
        with:
          flutter-version: 3.35.2
          channel: stable
      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable
        with:
          toolchain: 1.99.0
      - name: Prepare pinned native music module
        run: node integrations/spotube/prepare.mjs
      - name: Build unsigned native music libraries
        run: node integrations/spotube/build-android.mjs
      - name: Build AnF with embedded music
        run: |
          sdkmanager 'platforms;android-37.0' 'build-tools;36.0.0'
          npm ci --prefix windows
          npm ci --prefix android
          node scripts/build-android.mjs --with-spotube
          node scripts/check-release.mjs
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: AnF-Android-embedded-Spotube-review
          path: releases/AnF-Android-*.apk
          retention-days: 7
          if-no-files-found: error
  windows:
    if: inputs.platform != 'android'
    runs-on: windows-latest
    timeout-minutes: 90
    env:
      CARGO_BUILD_JOBS: 2
      CARGO_INCREMENTAL: 0
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 24
      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable
        with:
          toolchain: 1.99.0
      - uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2
        with:
          flutter-version: 3.35.2
          channel: stable
      - name: Prepare pinned embedded music
        run: node integrations/spotube/prepare.mjs --windows
      - name: Build native child view
        working-directory: windows/spotube-native
        run: flutter build windows --release
      - name: Prepare the existing offline AnF resources
        working-directory: windows
        run: |
          npm ci
          ./scripts/prepare-offline.ps1
          ./scripts/prepare-media.ps1
      - name: Build the AnF review installer and portable package
        working-directory: windows
        run: |
          cargo build --release --locked -p coucou-hook
          npm exec tauri -- build --features embedded-music --config src-tauri/tauri.spotube.conf.json
          node scripts/pack.mjs --with-spotube
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: AnF-Windows-embedded-Spotube-review
          path: windows/release/
          retention-days: 7
          if-no-files-found: error
