name: MKR Windows handoff cancellation QA
on:
  push:
    branches: ['qa/mkr-handoff-**']
    paths: ['windows/src-tauri/src/mkr_*.rs', 'windows/src-tauri/src/lib.rs', '.github/workflows/mkr-handoff-qa.yml']
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: mkr-handoff-${{ github.ref }}
  cancel-in-progress: false
jobs:
  handoff:
    runs-on: windows-latest
    timeout-minutes: 45
    env:
      CARGO_BUILD_JOBS: 2
      CARGO_PROFILE_DEV_DEBUG: 0
      CARGO_INCREMENTAL: 0
      TAURI_CONFIG: '{"bundle":{"resources":[],"active":false}}'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1
        with:
          node-version: 24
      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec
        with:
          toolchain: 1.99.0
      - uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9
        id: cargo-cache
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            windows/target
          key: windows-native-source-${{ hashFiles('windows/Cargo.lock') }}
          restore-keys: windows-cargo-
      - name: Build frontend assets required by the real Tauri test crate
        shell: pwsh
        run: |
          $ErrorActionPreference='Stop'
          npm ci --prefix windows
          if($LASTEXITCODE){throw 'Frontend dependency install failed'}
          npm run build --prefix windows
          if($LASTEXITCODE){throw 'Frontend assets failed'}
      - name: Compile real optional native bridge and run only handoff regressions
        shell: pwsh
        working-directory: windows
        run: |
          $ErrorActionPreference='Stop'
          cargo test --locked -p anf --lib --features embedded-mkr mkr_ -- --test-threads=1 2>&1 |
            Tee-Object -FilePath "$env:RUNNER_TEMP/mkr-handoff-tests.txt"
          if($LASTEXITCODE){throw 'Native handoff tests failed'}
      - name: Retain focused test log only; never installer, library or user data
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: MKR-Windows-handoff-evidence
          path: ${{ runner.temp }}/mkr-handoff-tests.txt
          if-no-files-found: ignore
          retention-days: 14
