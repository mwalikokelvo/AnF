name: MKR isolated runtime source inventory
on:
  push:
    branches: ['qa/mkr-inventory-**']
    paths:
      - integrations/mkr-music/**
      - .github/workflows/mkr-runtime-source-inventory.yml
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: mkr-inventory-${{ github.ref }}
  cancel-in-progress: false
jobs:
  inventory:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1
        with:
          node-version: 24
      - uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad
        with:
          distribution: temurin
          java-version: 21
      - uses: gradle/actions/setup-gradle@8da46b539cd8fe6ab27ca75128919a18d757604c
        with:
          gradle-version: 9.4.1
      - name: Prepare only the exact reviewed upstream source allowlist
        run: |
          set -euo pipefail
          git init "$RUNNER_TEMP/mkr-upstream"
          git -C "$RUNNER_TEMP/mkr-upstream" remote add origin https://github.com/mkr-infinity/mkr-music.git
          git -C "$RUNNER_TEMP/mkr-upstream" fetch --depth=1 origin 78ac80c5101c293a5591a4cd5a1ebc90ccbc3138
          node integrations/mkr-music/prepare-catalog.mjs --source "$RUNNER_TEMP/mkr-upstream"
      - name: Audit exact candidate runtime without provider requests
        working-directory: integrations/mkr-music/engine
        run: gradle --no-daemon --max-workers=2 verifyKtorAlignment auditWindowsRuntime
      - name: Check bounded source collection and metadata guards
        run: |
          python -B scripts/check-mkr-reviewed-source-inputs.py
          node scripts/check-mkr-jdk-source-binding.mjs
          python -B scripts/check-mkr-source-artifacts.py
          python -B scripts/check-mkr-dependency-review.py
      - name: Collect corresponding source evidence only
        run: python -B integrations/mkr-music/collect-source-artifacts.py
      - name: Review collected bytes against exact runtime hashes
        run: |
          python -B - <<'PY'
          import subprocess, sys
          from pathlib import Path
          base = Path('integrations/mkr-music')
          reports = list((base / 'engine/build/source-review').glob('*/source-artifacts.json'))
          assert len(reports) == 1, 'Expected one isolated source collection'
          subprocess.run([sys.executable, '-B', str(base / 'review-source-artifacts.py'),
              '--sources', str(reports[0]), '--output',
              str(base / 'engine/build/reports/source-artifact-evidence.json')], check=True)
          PY
      - name: Retain engineering reports only, no executable or release package
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: MKR-candidate-runtime-source-evidence
          path: |
            integrations/mkr-music/engine/build/reports/runtime-dependencies.json
            integrations/mkr-music/engine/build/reports/ktor-alignment.json
            integrations/mkr-music/engine/build/reports/source-artifact-evidence.json
            integrations/mkr-music/engine/build/source-review/**/source-artifacts.json
            integrations/mkr-music/engine/build/reports/dependency-verification/**/*.html
          if-no-files-found: ignore
          retention-days: 14
