name: Android packages
on:
  workflow_dispatch:
    inputs:
      baseline_run:
        description: Optional previous AnF-Android artifact run for installation upgrade QA
        required: false
        type: string
      baseline_artifact:
        description: Previous APK artifact name; select the artifact corresponding to the installed identity
        required: false
        default: AnF-Android
        type: string
      baseline_lineage:
        description: Identity installed in the previous APK; QA never treats different IDs as an in-place update
        type: choice
        options:
          - legacy
          - modern
        default: legacy
      baseline_filename:
        description: Optional exact APK basename inside the previous artifact; defaults to its single unsigned APK
        type: string
        required: false
      sign_legacy:
        description: Sign legacy production release with its existing owner key (manual main only; original modern .41 key remains separate)
        type: boolean
        default: false
  pull_request:
    paths:
      - android/**
      - windows/src/workspace/**
      - shared/**
      - scripts/**
      - .github/workflows/android*.yml
permissions:
  contents: read
  actions: read
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: |
            windows/package-lock.json
            android/package-lock.json
      - uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad
        with:
          distribution: temurin
          java-version: 21
      - uses: android-actions/setup-android@be39fa834029ff78f1a44aa3bb0819b8fc2bd8fd
        with:
          cmdline-tools-version: "16111833"
          packages: platform-tools
          log-accepted-android-sdk-licenses: false
      - uses: gradle/actions/setup-gradle@8da46b539cd8fe6ab27ca75128919a18d757604c # v6.4.1
        with:
          gradle-version: 9.4.1
      - name: Install SDK
        run: node scripts/prepare-android-sdk.mjs
      - name: Install frontend dependencies
        run: |
          npm ci --prefix windows
          npm ci --prefix android
      - name: Build and verify current APKs with mandatory source and release gates
        run: node scripts/verify-agent-gate.mjs --release ${{ matrix.flags }}
      - name: Check packaged stylesheets
        run: node scripts/check-styles.mjs android/build/assets/web
      - name: Marketplace trust rules (Java)
        run: |
          javac -d "$RUNNER_TEMP/addon-check" android/java/com/anf/workspace/AddonRules.java android/java-test/com/anf/workspace/AddonRulesCheck.java
          java -cp "$RUNNER_TEMP/addon-check" com.anf.workspace.AddonRulesCheck
      - name: Build installed-release instrumentation tests
        if: github.event_name == 'workflow_dispatch' && inputs.baseline_run != '' && matrix.lineage == (inputs.baseline_lineage || 'legacy')
        working-directory: android
        run: gradle --no-daemon assembleReleaseAndroidTest ${{ matrix.legacy == 'true' && '-PlegacyApplicationId=true' || '' }}
      - name: Download previous Android package
        if: github.event_name == 'workflow_dispatch' && inputs.baseline_run != '' && matrix.lineage == (inputs.baseline_lineage || 'legacy')
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333
        with:
          name: ${{ inputs.baseline_artifact || 'AnF-Android' }}
          run-id: ${{ inputs.baseline_run }}
          github-token: ${{ github.token }}
          path: previous-android
      - name: Enable emulator hardware acceleration
        if: github.event_name == 'workflow_dispatch' && inputs.baseline_run != '' && matrix.lineage == (inputs.baseline_lineage || 'legacy')
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Free unused native SDK toolchains for emulator storage
        if: github.event_name == 'workflow_dispatch' && inputs.baseline_run != '' && matrix.lineage == (inputs.baseline_lineage || 'legacy')
        run: |
          # This Java app ships prebuilt native libraries; its build is complete.
          # These hosted-runner NDK installations are unused by the UI test.
          sudo rm -rf /usr/local/lib/android/sdk/ndk
          df -h /
      - name: Verify installed Android release and saved-data retention
        if: github.event_name == 'workflow_dispatch' && inputs.baseline_run != '' && matrix.lineage == (inputs.baseline_lineage || 'legacy')
        uses: reactivecircus/android-emulator-runner@a421e43855164a8197daf9d8d40fe71c6996bb0d
        with:
          api-level: 35
          arch: x86_64
          target: google_apis
          disk-size: 2048M
          disable-animations: true
          emulator-options: -no-window -gpu swiftshader_indirect -no-audio -no-snapshot -no-boot-anim -partition-size 2048
          script: bash scripts/app-qa/run-android-upgrade.sh
      - name: Retain installed Android test evidence
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        if: always() && github.event_name == 'workflow_dispatch' && inputs.baseline_run != '' && matrix.lineage == (inputs.baseline_lineage || 'legacy')
        with:
          name: AnF-Android-installation-tests-${{ matrix.lineage }}
          path: |
            ${{ runner.temp }}/anf-android-qa/*.txt
            ${{ runner.temp }}/anf-android-qa/*.png
          if-no-files-found: ignore
          retention-days: 7
      - name: Self-test the signing step with a throwaway key
        run: |
          version=$(node -p "require('./windows/src-tauri/tauri.conf.json').version")
          keytool -genkeypair -keystore "$RUNNER_TEMP/throwaway.jks" -storetype JKS -storepass throwaway \
            -alias throwaway -keyalg RSA -keysize 2048 -validity 1 -dname CN=throwaway -noprompt
          KEY_BASE64=$(base64 -w0 "$RUNNER_TEMP/throwaway.jks") KEY_PASSWORD=throwaway \
            bash scripts/sign-android.sh "releases/$ANF_ANDROID_PREFIX-$version-unsigned.apk" "$RUNNER_TEMP/selftest.apk"
          rm -f "$RUNNER_TEMP/throwaway.jks" "$RUNNER_TEMP/selftest.apk"
        if: matrix.lineage == 'legacy'
      - name: Sign legacy production APK using the original key only
        if: github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main' && inputs.sign_legacy && matrix.lineage == 'legacy'
        env:
          KEY_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          KEY_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          KEY_ENTRY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          if [ -z "$KEY_BASE64" ] || [ -z "$KEY_PASSWORD" ]; then
            echo "::error::The original legacy signing key is required. No substitute key or update-compatible APK will be generated."
            exit 1
          fi
          version=$(node -p "require('./windows/src-tauri/tauri.conf.json').version")
          bash scripts/sign-android.sh "releases/$ANF_ANDROID_PREFIX-$version-unsigned.apk" "releases/$ANF_ANDROID_PREFIX-$version-signed.apk"
          node scripts/verify-android-release.mjs --legacy --signed
      - name: Verify identity, source, alignment and actual signer; write all APK checksums
        run: |
          set -euo pipefail
          version=$(node -p "require('./windows/src-tauri/tauri.conf.json').version")
          args=(${{ matrix.flags }})
          if [ -f "releases/$ANF_ANDROID_PREFIX-$version-signed.apk" ]; then args+=(--signed); fi
          node scripts/verify-android-release.mjs "${args[@]}"
          (cd releases && sha256sum "$ANF_ANDROID_PREFIX"-*.apk > "$ANF_ANDROID_CHECKSUMS")
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: ${{ matrix.artifact }}
          path: releases/
          if-no-files-found: error
          retention-days: 7
    strategy:
      fail-fast: false
      matrix:
        include:
          - lineage: modern
            legacy: "false"
            flags: ""
            application_id: com.anf.workspace
            prefix: AnF-Android
            artifact: AnF-Android
            report: android-release-verification.json
            checksums: SHA256SUMS-Android
          - lineage: legacy
            legacy: "true"
            flags: --legacy
            application_id: com.coucou.workspace
            prefix: AnF-Android-Legacy
            artifact: AnF-Android-Legacy
            report: android-release-verification-legacy.json
            checksums: SHA256SUMS-Android-Legacy
    env:
      ANF_QA_ANDROID_ID: ${{ matrix.application_id }}
      ANF_QA_ANDROID_LEGACY: ${{ matrix.legacy }}
      ANF_QA_BASELINE_FILENAME: ${{ inputs.baseline_filename }}
      ANF_ANDROID_PREFIX: ${{ matrix.prefix }}
      ANF_ANDROID_CHECKSUMS: ${{ matrix.checksums }}
