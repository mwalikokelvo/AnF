name: Android packages
on:
  workflow_dispatch:
  pull_request:
    paths: ['android/**', 'windows/src/workspace/**', 'scripts/**', '.github/workflows/android*.yml']
permissions:
  contents: read
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
jobs:
  android-package:
    uses: ./.github/workflows/android-release-gate.yml
# New identity requires export/import from the still-installed legacy app.
# Do not run the old same-package upgrade/uninstall test against the new app.
# This workflow builds only and has no signing secrets or publication permission.
