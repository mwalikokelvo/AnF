[package]
name = "anf-mkr-windows-audio"
version = "0.1.0"
edition = "2021"
license = "MIT"
description = "AnF-owned Windows audio engine prototype; no external player or UI availability claim"

[target.'cfg(windows)'.dependencies]
windows = { version = "=0.61.3", features = ["Foundation", "Media_Core", "Media_Playback", "Win32_System_WinRT", "Win32_System_Com", "Win32_Security_Cryptography", "Win32_System_JobObjects", "Win32_System_Threading"] }
url = "=2.5.8"
serde = { version = "=1.0.229", features = ["derive"] }
serde_json = "=1.0.154"
sha2 = "=0.10.9"
