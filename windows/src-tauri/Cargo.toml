[package]
name = "coucou"
description = "Coucou for Windows and Linux — Mochi lives at the top of your screen"
authors = ["Louis Raille"]
version.workspace = true
edition.workspace = true
license.workspace = true

[features]
embedded-music = []
# Kevo's ears (Phase 1): on-PC hearing with sherpa-onnx, linked statically.
# On in release builds (`npm run pack`) and in the Windows and Linux CI tests.
kevo-ears = ["dep:sherpa-onnx", "dep:cpal"]

[lib]
name = "coucou_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
anf-vault = { path = "../../crates/anf-vault" }
rusqlite = { version = "=0.40.2", features = ["bundled-sqlcipher-vendored-openssl"] }
tauri = { version = "2", features = ["tray-icon", "custom-protocol"] }
tauri-plugin-single-instance = "2"
tauri-plugin-autostart = "2"
serde = { version = "1", features = ["derive"] }
sysinfo = "0.31"
serde_json = { version = "1", features = ["preserve_order"] }
tokio = { version = "1", features = ["net", "io-util", "sync", "time", "rt", "macros"] }
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }
pdf-extract = "0.12"
scraper = "0.24"
zip = { version = "2.4", default-features = false, features = ["deflate-flate2", "flate2"] }
flate2 = { version = "1", default-features = false, features = ["rust_backend"] }
quick-xml = "0.42"
ocrs = { version = "0.13.1", default-features = false, features = ["rten"] }
rten = { version = "0.26", default-features = false, features = ["rten_format"] }
image = { version = "0.25", default-features = false, features = ["png", "jpeg"] }
sha2 = "0.11"
md-5 = "0.10"
ring = "0.17"
# Exact pin: its build script downloads the matching prebuilt static libraries
# from github.com/k2-fsa/sherpa-onnx/releases (see src/kevo_ears.rs).
sherpa-onnx = { version = "=2.0.2", optional = true }
cpal = { version = "0.15", optional = true }

[dev-dependencies]
# Paused test clock for the approval gate's 60 s timeout (kevo_approval tests).
tokio = { version = "1", features = ["test-util"] }

[target.'cfg(windows)'.dependencies]
keyring = { version = "3", features = ["windows-native"] }
windows = { version = "0.61", features = [
  "Data_Pdf",
  "Storage",
  "Storage_Streams",
  "Foundation",
  "Win32_System_WinRT",
  "Win32_Foundation",
  "Win32_Graphics_Gdi",
  "Win32_Security",
  "Win32_Security_Authorization",
  "Win32_System_Ole",
  "Win32_System_SystemInformation",
  "Win32_System_Threading",
  "Win32_UI_Input_KeyboardAndMouse",
  "Win32_UI_WindowsAndMessaging",
] }

[target.'cfg(target_os = "linux")'.dependencies]
keyring = { version = "3", features = ["sync-secret-service", "crypto-rust"] }
libc = "0.2"
gtk = "0.18"
