[workspace]
members = ["src-tauri", "hook"]
resolver = "2"

[workspace.package]
version = "0.1.62"
edition = "2021"
license = "MIT"

# Release profile shared by the app and the hook relay: the hook must start fast
# (Claude Code spawns it on every event), so we optimise for size and speed.
# SQLite/SQLCipher is C code: build it optimised in debug and test builds too, so
# speed tests (vault search < 50 ms) measure what users get.
[profile.dev.package.libsqlite3-sys]
opt-level = 3

[profile.release.package.libsqlite3-sys]
opt-level = 3

[profile.release]
opt-level = "s"
lto = false
# 4 units keep peak RSS ~1GB each on low-RAM Windows boxes; codegen-units=1 OOMs near 4.7GB.
codegen-units = 4
panic = "abort"
strip = true
