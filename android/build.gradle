buildscript {
    repositories { google(); mavenCentral() }
    dependencies {
        classpath 'com.android.tools.build:gradle:9.2.1'
    }
}
apply plugin: 'com.android.application'
def config = new groovy.json.JsonSlurper().parse(file('../windows/src-tauri/tauri.conf.json'))
def components = config.version.tokenize('.').collect { it as int }
layout.buildDirectory = file('gradle-build')
android {
    namespace 'com.anf.workspace'
    compileSdk 37
    buildToolsVersion '36.0.0'
    if (project.hasProperty('spotubeRepository')) ndkVersion '27.0.12077973'
    defaultConfig {
        applicationId 'com.anf.workspace'
        // Explicit legacy build keeps the original sandbox and production update path.
        if (project.hasProperty('legacyApplicationId')) applicationId 'com.coucou.workspace'
        minSdk 26
        targetSdk 35
        versionCode components[0] * 1000000 + components[1] * 1000 + components[2]
        versionName config.version
        manifestPlaceholders = [appLabel: 'AnF']
        if (project.hasProperty('spotubeRepository')) {
            ndk {
                if (project.hasProperty('musicPreviewAbi')) abiFilters providers.gradleProperty('musicPreviewAbi').get()
                else abiFilters 'arm64-v8a', 'x86_64'
            }
        }
        testInstrumentationRunner 'androidx.test.runner.AndroidJUnitRunner'
    }
    sourceSets {
        main {
            manifest.srcFile 'gradle-input/AndroidManifest.xml'
            java.srcDirs = ['java']
            // Per-variant generated resources contain the exact installed ID,
            // including the isolated review suffix; see identity-resources.gradle.
            res.srcDirs = []
            assets.srcDirs = ['build/assets']
            if (project.hasProperty('spotubeRepository')) java.srcDirs += ['spotube-host']
        }
        androidTest {
            assets.srcDirs = ['src/androidTest/assets', '../windows/src-tauri/tests/data']
        }
        if (providers.gradleProperty('mkrReviewRuntime').getOrElse('false')=='true') {
            review {
                manifest.srcFile 'mkr-review/AndroidManifest.xml'
                assets.srcDirs += ['gradle-build/mkr-review-notices']
            }
        }
    }
    testBuildType(project.hasProperty('mkrReviewRuntime') && project.property('mkrReviewRuntime')=='true' ? 'review' : 'release')
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_1_8
        targetCompatibility JavaVersion.VERSION_1_8
        coreLibraryDesugaringEnabled project.hasProperty('spotubeRepository')
    }
    def keystorePath = System.getenv('ANDROID_KEYSTORE_PATH')
    signingConfigs {
        if (keystorePath) {
            release {
                storeFile file(keystorePath)
                storePassword System.getenv('ANDROID_KEYSTORE_PASSWORD')
                keyAlias System.getenv('ANDROID_KEY_ALIAS')
                keyPassword System.getenv('ANDROID_KEY_PASSWORD')
            }
        }
    }
    buildTypes {
        release {
            minifyEnabled false
            if (keystorePath) signingConfig signingConfigs.release
        }
        review {
            initWith release
            applicationIdSuffix '.musicdev'
            versionNameSuffix '-music-preview'
            manifestPlaceholders = [appLabel: 'AnF Music Preview']
            signingConfig signingConfigs.debug
            matchingFallbacks = ['release']
            ndk {
                abiFilters.clear()
                abiFilters providers.gradleProperty('musicPreviewAbi').getOrElse('arm64-v8a')
            }
        }
    }
    packaging {
        resources { excludes += ['META-INF/DEPENDENCIES'] }
        if (project.hasProperty('spotubeRepository')) jniLibs.useLegacyPackaging = true
    }
}
apply from: 'identity-resources.gradle'
dependencies {
    if (providers.gradleProperty('mkrReviewRuntime').getOrElse('false')=='true') {
        reviewImplementation 'com.anf.mkr:anf-mkr-android-catalog:0.1.0-prototype'
    }
    if (project.hasProperty('spotubeRepository')) {
        coreLibraryDesugaring 'com.android.tools:desugar_jdk_libs:2.1.5'
        releaseImplementation 'com.anf.spotube:flutter_release:1.0'
        reviewImplementation 'com.anf.spotube:flutter_release:1.0'
        debugImplementation 'com.anf.spotube:flutter_debug:1.0'
    }
    androidTestImplementation 'androidx.test:runner:1.6.2'
    androidTestImplementation 'junit:junit:4.13.2'
    implementation 'net.zetetic:sqlcipher-android:4.20.0'
    implementation 'androidx.sqlite:sqlite:2.7.0'
    implementation 'androidx.media3:media3-exoplayer:1.6.1'
    implementation 'androidx.media3:media3-session:1.6.1'
}

// Review evidence only. Release dependencies remain independent of the flag.
tasks.register('mkrReviewRuntimeInventory') {
    doLast {
        def combined=providers.gradleProperty('mkrReviewRuntime').getOrElse('false')=='true'
        def inventories=[:]
        ['releaseRuntimeClasspath','reviewRuntimeClasspath'].each { configuration ->
            inventories[configuration]=configurations.getByName(configuration).resolvedConfiguration.resolvedArtifacts.collect { artifact ->
                def digest=java.security.MessageDigest.getInstance('SHA-256')
                artifact.file.withInputStream { input ->
                    byte[] buffer=new byte[65536];int count
                    while((count=input.read(buffer))!=-1)digest.update(buffer,0,count)
                }
                [coordinate:artifact.moduleVersion.id.toString(),sha256:digest.digest().encodeHex().toString()]
            }.sort { a,b -> a.coordinate <=> b.coordinate }
        }
        def out=file('gradle-build/'+(combined?'mkr-combined-runtime.json':'mkr-baseline-runtime.json'))
        out.parentFile.mkdirs()
        out.setText(groovy.json.JsonOutput.prettyPrint(groovy.json.JsonOutput.toJson([
            sourceCommit:System.getenv('GITHUB_SHA'),combined:combined,inventories:inventories,readyForPublication:false
        ])),'UTF-8')
    }
}
tasks.register('prepareAnFManifest') {
    inputs.file 'AndroidManifest.xml'
    outputs.file 'gradle-input/AndroidManifest.xml'
    doLast {
        def destination=file('gradle-input/AndroidManifest.xml');destination.parentFile.mkdirs()
        def manifest = file('AndroidManifest.xml').getText('UTF-8').replaceFirst(/\s+package="[^"]+"/,'')
        if (project.hasProperty('legacyApplicationId')) {
            // Keep the original launcher component and pinned Quick Settings tile.
            // The implementation stays in the modern Java namespace.
            manifest=manifest.replace('<intent-filter><action android:name="android.intent.action.MAIN"/><category android:name="android.intent.category.LAUNCHER"/></intent-filter>', '')
            manifest=manifest.replace('<meta-data android:name="android.app.shortcuts" android:resource="@xml/shortcuts"/>', '')
            manifest=manifest.replace('android:name=".QuickNoteTile"', 'android:name="com.coucou.workspace.QuickNoteTile"')
            manifest=manifest.replace('android:name=".PlaybackService"', 'android:name="com.coucou.workspace.PlaybackService"')
            manifest=manifest.replace('</application>', '''
    <activity-alias android:name="com.coucou.workspace.MainActivity" android:targetActivity="com.anf.workspace.MainActivity" android:exported="true">
      <intent-filter><action android:name="android.intent.action.MAIN"/><category android:name="android.intent.category.LAUNCHER"/></intent-filter>
      <meta-data android:name="android.app.shortcuts" android:resource="@xml/shortcuts"/>
    </activity-alias>
  </application>''')
        }
        if (project.hasProperty('spotubeRepository')) {
            manifest=manifest.replace('<application', '''<uses-permission android:name="android.permission.READ_MEDIA_AUDIO" />
  <uses-permission android:name="android.permission.READ_EXTERNAL_STORAGE" android:maxSdkVersion="32" />
  <application''')
            manifest=manifest.replace('</application>', '''
    <activity android:name=".MusicActivity" android:exported="false" android:hardwareAccelerated="true" android:theme="@android:style/Theme.Material.NoActionBar" android:configChanges="orientation|keyboardHidden|keyboard|screenSize|smallestScreenSize|locale|layoutDirection|fontScale|screenLayout|density|uiMode" />
    <service android:name="com.ryanheise.audioservice.AudioService" android:exported="true" android:foregroundServiceType="mediaPlayback">
      <intent-filter><action android:name="android.media.browse.MediaBrowserService" /></intent-filter>
    </service>
    <receiver android:name="com.ryanheise.audioservice.MediaButtonReceiver" android:exported="true">
      <intent-filter><action android:name="android.intent.action.MEDIA_BUTTON" /></intent-filter>
    </receiver>
    <meta-data android:name="flutterEmbedding" android:value="2" />
  </application>''')
        }
        destination.setText(manifest,'UTF-8')
    }
    inputs.property 'spotubeEnabled', project.hasProperty('spotubeRepository')
    inputs.property 'legacyApplicationId', project.hasProperty('legacyApplicationId')
}
tasks.named('preBuild').configure { dependsOn 'prepareAnFManifest' }

if (providers.gradleProperty('mkrReviewRuntime').getOrElse('false')=='true') {
    tasks.register('prepareMkrReviewNotices', Sync) {
        into 'gradle-build/mkr-review-notices/licenses/mkr'
        from('../integrations/mkr-music/engine/vendor/mkr/LICENSE') { rename { 'UPSTREAM-LICENSE.txt' } }
        from('../integrations/mkr-music/engine/PRIMARY-LICENSE.txt')
        from('../integrations/mkr-music/README.md') { rename { 'REVIEW-NOTICE.md' } }
        doLast {
            ['UPSTREAM-LICENSE.txt','PRIMARY-LICENSE.txt','REVIEW-NOTICE.md'].each { name ->
                if (!file('gradle-build/mkr-review-notices/licenses/mkr/'+name).isFile()) {
                    throw new GradleException('Required MKR review notice missing: '+name)
                }
            }
        }
    }
    tasks.named('preBuild').configure { dependsOn 'prepareMkrReviewNotices' }
}

// Record only the runtime artifacts actually resolved for the shipped app.
tasks.register('audioRuntimeInventory') {
    doLast {
        def entries=configurations.releaseRuntimeClasspath.resolvedConfiguration.resolvedArtifacts.collect {
            [group:it.moduleVersion.id.group,name:it.name,version:it.moduleVersion.id.version,file:it.file.absolutePath]
        }.sort { a,b -> (a.group+':'+a.name) <=> (b.group+':'+b.name) }
        file('gradle-build/audio-runtime.json').setText(groovy.json.JsonOutput.prettyPrint(groovy.json.JsonOutput.toJson(entries)), 'UTF-8')
    }
}
